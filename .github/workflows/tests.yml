# The engine's own tests: guard, protocol (mem.py), parsers, atlas redaction, and the front end.
# Separate from memory-gate.yml, which judges NOTES; this judges the CODE that judges notes.
# Offline and keyless. Runs on any PR or push that touches the machinery.
name: tests

on:
  # Every PR and every push to main: path filters left seven policy and executable roots untested
  # (audit 10-F5), and the suite is cheap.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install the page's build and test deps, pinned by web/package-lock.json
        run: cd web && npm ci --no-audit --no-fund
      # GitHub's Ubuntu runners ship Google Chrome; browser.mjs uses it for the layout, text-width
      # and CSP checks jsdom cannot make. It would print SKIP, and run_tests.sh would show it, if not.
      - name: Point the browser checks at the runner's Chrome
        run: echo "CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable)" >> "$GITHUB_ENV"
      - name: Run every offline check
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          bash tools/run_tests.sh

  windows-sync:
    # Windows PowerShell 5.1 is preinstalled on GitHub's Windows runners, so the sync path the
    # Windows dispatcher uses is tested on every change, not only by hand (audit 06-F2/F3/F13).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Sync and scaffold scenarios against the PowerShell scripts
        shell: pwsh
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          python tools/test_sync.py --impl powershell
          python tools/test_scaffold.py --impl powershell
