# A planning change ripples: once it is on main, every note that depends on it is stamped
# review_needed and a steward gets one issue listing them.
#
# Moved out of memory-gate.yml (audit 10-F6): there it required `pull_request.merged == true` on
# events that are never merged, so it could not run. On a push to main the code is already
# reviewed and trusted, and the range is exactly what landed.
name: cascade

on:
  push:
    branches: [main]
    paths-ignore:
      - "web/data/**"
      - "log/CHANGELOG.md"

permissions:
  contents: write
  issues: write

concurrency:
  group: memory-main-writer
  cancel-in-progress: false

jobs:
  instance:
    # The template repository has no owner yet (roles.json "instance": false), so the gates that
    # need people, CODEOWNERS and a real policy would fail on every change for a reason no change
    # can fix. They start the moment scripts/init.py marks the repository as an instance.
    runs-on: ubuntu-latest
    outputs:
      instance: ${{ steps.read.outputs.instance }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: governance/roles.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: read
        run: |
          python3 -c 'import json; print("instance=" + ("true" if json.load(open("governance/roles.json")).get("instance") is True else "false"))' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  cascade:
    needs: instance
    if: github.actor != 'github-actions[bot]' && needs.instance.outputs.instance == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Stamp dependents and open a review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MEMORY_ACTOR_KIND: bot
        run: |
          set -euo pipefail
          OUT=$(python scripts/memory_guard.py cascade --range "$BEFORE..$AFTER")
          echo "$OUT"
          if echo "$OUT" | grep -q "<- depends on"; then
            python scripts/memory_guard.py cascade --range "$BEFORE..$AFTER" --apply
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "memory: cascade review_needed from $AFTER [skip ci]"
            git push origin HEAD:main
            gh issue create --title "Memory cascade from ${AFTER:0:7}" \
              --body "$(printf 'A planning-level change landed and these notes depend on it. Re-read each one; update it or clear its `review_needed` field.\n\n```\n%s\n```\n' "$OUT")"
          fi
